<link rel="stylesheet" href="/assets/css/cms.css" />
<section id="cms">
  {% block body %}
  <div class="cs-container">
    <div class="cs-content">
      {% if collections.post | length == 0 %}
      <h1>No Recent Posts</h1>
      {% else %} {%- for post in collections.post | reverse -%}
      <div class="cs-product">
        <picture>
          <img
            src="{{ post.data.image }}"
            alt="{{ post.data.imageAlt }}"
            width="795"
            height="400"
            decoding="async"
          />
        </picture>
        <span>{{ post.data.delivery }}</span>
        <span>{{ post.data.specification }}</span>
        <span>{{ post.data.brand }}</span>
        <span>{{ post.data.price }}</span>
      </div>
      {%- endfor -%} {% endif %}
    </div>
  </div>
  {% endblock %}
</section>
